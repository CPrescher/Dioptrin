[project]
name = "dioptrin"
version = "0.11.0"
description = "Fast open-source diffraction integration powered by Rust"
readme = "README-pypi.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.16"
dependencies = [
    "numpy>=1.23",
]

[project.urls]
Documentation = "https://dioptrin.readthedocs.io/en/latest/"
Repository = "https://github.com/CPrescher/Dioptrin"
Issues = "https://github.com/CPrescher/Dioptrin/issues"

[project.optional-dependencies]
test = ["h5py", "fabio", "tifffile", "pyfai>=2025.12.1", "matplotlib>=3.10.8"]
benchmark = ["h5py", "fabio", "bitshuffle", "psutil", "pyfai>=2025.12.1"]

[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[tool.maturin]
bindings = "pyo3"
features = ["python"]
profile = "release"
