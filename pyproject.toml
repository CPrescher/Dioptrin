[project]
name = "dioptrin"
version = "0.4.4"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.23",
]

[project.optional-dependencies]
test = ["h5py", "fabio", "pyfai>=2025.12.1", "matplotlib>=3.10.8"]
benchmark = ["h5py", "fabio", "bitshuffle", "psutil", "pyfai>=2025.12.1"]

[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[tool.maturin]
bindings = "pyo3"
features = ["python"]
profile = "release"
