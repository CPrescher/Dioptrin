[project]
name = "dioptrin"
version = "0.3.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipython>=9.8.0",
    "matplotlib>=3.10.8",
    "numpy>=1.23",
    "pyfai>=2025.12.1",
]

[project.optional-dependencies]
benchmark = ["h5py", "fabio", "bitshuffle"]

[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[tool.maturin]
bindings = "pyo3"
features = ["python"]
profile = "release"
