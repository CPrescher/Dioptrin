[project]
name = "dioptrin"
version = "0.6.1"
description = "Fast, license-activated diffraction integration powered by Rust"
readme = "README-pypi.md"
requires-python = ">=3.11,<3.16"
dependencies = [
    "numpy>=1.23",
]

[project.optional-dependencies]
test = ["h5py", "fabio", "tifffile", "pyfai>=2025.12.1", "matplotlib>=3.10.8"]
benchmark = ["h5py", "fabio", "bitshuffle", "psutil", "pyfai>=2025.12.1"]

[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[tool.maturin]
bindings = "pyo3"
features = ["python"]
profile = "release"
