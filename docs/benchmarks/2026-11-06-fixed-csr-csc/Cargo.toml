[package]
name = "dioptrin-fixed-csr-csc-probe"
version = "0.1.0"
edition = "2024"
license = "MIT"
[[bin]]
name = "fixed-csr-csc"
path = "main.rs"
[dependencies]
dioptrin = { path = "../../.." }
rayon = "1.5"
memmap2 = "0.9.11"
