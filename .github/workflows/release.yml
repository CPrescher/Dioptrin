name: Release

# Pull requests build a smoke matrix (one Python per OS) and only when
# packaging-relevant files change. Tags and manual runs build every wheel.
# Run this workflow manually on main before tagging to check the full matrix.
# A pushed v* tag publishes: GitHub release, then PyPI, then crates.io.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.*'
      - 'pyproject.toml'
      - 'dioptrin.pyi'
      - 'README-pypi.md'
      - 'LICENSE'
      - 'licenses/**'
      - 'scripts/**'
      - 'python_examples/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

# Pull request runs share a group per ref so a new push cancels the old run.
# Tag and manual runs each get their own group, so they never queue or cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wheels:
    name: Wheels (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-15-intel]
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["3.13"]' || '["3.11", "3.12", "3.13", "3.14", "3.15"]') }}
        exclude:
          - os: windows-11-arm
            python: '3.11'
          - os: windows-11-arm
            python: '3.12'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Select wheel features
        id: features
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-*|windows-latest)
              echo "features=python,cuda" >> "$GITHUB_OUTPUT"
              echo "expect_cuda=1" >> "$GITHUB_OUTPUT"
              echo "expect_metal=0" >> "$GITHUB_OUTPUT"
              ;;
            macos-*)
              echo "features=python,metal" >> "$GITHUB_OUTPUT"
              echo "expect_cuda=0" >> "$GITHUB_OUTPUT"
              echo "expect_metal=1" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "features=python" >> "$GITHUB_OUTPUT"
              echo "expect_cuda=0" >> "$GITHUB_OUTPUT"
              echo "expect_metal=0" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - name: Build unrestricted wheels
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist --features ${{ steps.features.outputs.features }} -i ${{ matrix.python }}
          maturin-version: 'v1.16.0'
          cache: 'none'
          manylinux: '2_28'
      - name: Check publication contents
        run: python scripts/check_release_wheels.py dist
      - name: Install and check unrestricted wheel
        shell: bash
        env:
          DIOPTRIN_EXPECT_CUDA: ${{ steps.features.outputs.expect_cuda }}
          DIOPTRIN_EXPECT_METAL: ${{ steps.features.outputs.expect_metal }}
        run: |
          python -m pip install --only-binary=:all: dist/*.whl
          python scripts/check_unrestricted_install.py
          python -m unittest python_examples.test_dynamic_plan -q
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install maturin
      - run: maturin sdist --out dist
      - run: python scripts/check_release_wheels.py dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  crate:
    name: Crate package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tag against package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PYVERSION'
          import os, tomllib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          with open("Cargo.toml", "rb") as f:
              cargo = tomllib.load(f)["package"]["version"]
          with open("pyproject.toml", "rb") as f:
              python = tomllib.load(f)["project"]["version"]
          if not tag == cargo == python:
              raise SystemExit(f"Tag {tag}, Cargo.toml {cargo} and pyproject.toml {python} differ")
          print(f"Tag, Cargo.toml and pyproject.toml agree on {tag}")
          PYVERSION
      # Packages the crate exactly as crates.io would receive it and builds
      # the packaged copy, so a broken include list fails before anything is
      # published to either registry.
      - run: cargo publish --dry-run

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist, crate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - run: python scripts/check_release_wheels.py dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYNOTES'
          import os, re
          from pathlib import Path
          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text()
          match = re.search(r"^## \[" + re.escape(version) + r"\].*?\n(.*?)(?=^## \[|\Z)",
                            changelog, flags=re.MULTILINE | re.DOTALL)
          if match is None or not match.group(1).strip():
              raise SystemExit("Missing release notes for " + version)
          notes = match.group(1).strip()
          root = "https://github.com/" + os.environ["GITHUB_REPOSITORY"]
          root += "/blob/" + os.environ["GITHUB_REF_NAME"] + "/docs/"
          notes = notes.replace("](docs/", "](" + root)
          Path("RELEASE_NOTES.md").write_text(notes + "\n")
          PYNOTES
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file RELEASE_NOTES.md dist/*.whl dist/*.tar.gz

  pypi-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist, crate, release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dioptrin/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - run: python scripts/check_release_wheels.py dist
      - name: Publish wheels and source distribution
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          attestations: false

  # Runs last so that a crates.io problem (for example trusted publishing not
  # yet configured) cannot hold back the GitHub release or PyPI; the package
  # itself was already verified by the crate job. It waits for the PyPI job
  # but does not require it to succeed, so a PyPI failure does not block
  # crates.io either. After fixing a cause, re-run the failed job. Only a
  # pushed tag publishes here, never a manual run. The very first crates.io
  # upload has to be made by hand with an API token, because trusted
  # publishing can only be set up for a crate that already exists; this job
  # then skips that version.
  crates-io-publish:
    if: >-
      !cancelled() && github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.crate.result == 'success' && needs.release.result == 'success'
    needs: [crate, release, pypi-publish]
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/dioptrin
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check whether this version is already on crates.io
        id: existing
        run: |
          python3 - <<'PYINDEX'
          import json, os, tomllib, urllib.error, urllib.request
          with open("Cargo.toml", "rb") as f:
              package = tomllib.load(f)["package"]
          name, version = package["name"], package["version"]
          if version != os.environ["GITHUB_REF_NAME"].removeprefix("v"):
              raise SystemExit(f"Cargo.toml version {version} does not match the tag")
          url = f"https://index.crates.io/{name[:2]}/{name[2:4]}/{name}"
          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  lines = response.read().decode().splitlines()
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              lines = []
          published = any(json.loads(line)["vers"] == version for line in lines if line)
          if published:
              print(f"::notice::{name} {version} is already on crates.io; skipping the upload")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"published={str(published).lower()}\n")
          PYINDEX
      - name: Get a crates.io token through trusted publishing
        if: steps.existing.outputs.published != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1.0.6
      - name: Publish crate
        if: steps.existing.outputs.published != 'true'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
