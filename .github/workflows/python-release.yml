name: Python Build

# Pull requests build a smoke matrix (one Python per OS) and only when
# packaging-relevant files change. Tags and manual runs build every wheel.
# Run this workflow manually on main before tagging to check the full matrix.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.*'
      - 'pyproject.toml'
      - 'dioptrin.pyi'
      - 'README-pypi.md'
      - 'LICENSE'
      - 'licenses/**'
      - 'scripts/**'
      - 'python_examples/**'
      - '.github/workflows/python-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wheels:
    name: Wheels (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-15-intel]
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["3.13"]' || '["3.11", "3.12", "3.13", "3.14", "3.15"]') }}
        exclude:
          - os: windows-11-arm
            python: '3.11'
          - os: windows-11-arm
            python: '3.12'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Build unrestricted wheels
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist --features python -i ${{ matrix.python }}
          maturin-version: 'v1.16.0'
          cache: 'none'
          manylinux: '2_28'
      - name: Check publication contents
        run: python scripts/check_release_wheels.py dist
      - name: Install and check unrestricted wheel
        shell: bash
        run: |
          python -m pip install --only-binary=:all: dist/*.whl
          python scripts/check_unrestricted_install.py
          python -m unittest python_examples.test_dynamic_plan -q
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install maturin
      - run: maturin sdist --out dist
      - run: python scripts/check_release_wheels.py dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - run: python scripts/check_release_wheels.py dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYNOTES'
          import os, re
          from pathlib import Path
          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text()
          match = re.search(r"^## \[" + re.escape(version) + r"\].*?\n(.*?)(?=^## \[|\Z)",
                            changelog, flags=re.MULTILINE | re.DOTALL)
          if match is None or not match.group(1).strip():
              raise SystemExit("Missing release notes for " + version)
          notes = match.group(1).strip()
          root = "https://github.com/" + os.environ["GITHUB_REPOSITORY"]
          root += "/blob/" + os.environ["GITHUB_REF_NAME"] + "/docs/"
          notes = notes.replace("](docs/", "](" + root)
          Path("RELEASE_NOTES.md").write_text(notes + "\n")
          PYNOTES
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file RELEASE_NOTES.md dist/*.whl dist/*.tar.gz

  pypi-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist, release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dioptrin/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - run: python scripts/check_release_wheels.py dist
      - name: Publish wheels and source distribution
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          attestations: false
