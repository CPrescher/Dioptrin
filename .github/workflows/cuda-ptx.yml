name: CUDA PTX

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/integration/cuda/kernels.cu"
      - "src/integration/cuda/kernels.ptx"
      - "scripts/build_cuda_ptx.sh"
      - ".github/workflows/cuda-ptx.yml"

jobs:
  build-ptx:
    name: Build & verify precompiled PTX (nvcc)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install nvcc (CUDA toolkit)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nvidia-cuda-toolkit
          nvcc --version

      - name: Compile kernels.cu to PTX
        run: bash scripts/build_cuda_ptx.sh

      - name: Upload compiled kernels.ptx artifact
        uses: actions/upload-artifact@v4
        with:
          name: cuda-ptx
          path: src/integration/cuda/kernels.ptx
          retention-days: 7

      - name: Verify committed kernels.ptx matches kernels.cu
        run: |
          EXPECTED_SHA="$(sha256sum src/integration/cuda/kernels.cu | awk '{print $1}')"
          COMMITTED_SHA="$(git show HEAD:src/integration/cuda/kernels.ptx 2>/dev/null | sed -n 's|^// dioptrin-kernels-sha256: ||p' | head -n 1 || true)"
          echo "kernels.cu sha256: $EXPECTED_SHA"
          echo "committed kernels.ptx sha256: ${COMMITTED_SHA:-<missing>}"
          if [ "$COMMITTED_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::src/integration/cuda/kernels.ptx is out of date with kernels.cu. Download the 'cuda-ptx' artifact from this run and commit it."
            exit 1
          fi
