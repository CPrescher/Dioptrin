name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Rust tests
        run: cargo test

      - name: Check Rust formatting
        run: cargo fmt -- --check

  python-tests:
    name: Python Tests & Examples
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-py${{ matrix.python-version }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python dependencies
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install maturin

      - name: Build Python package
        run: |
          source .venv/bin/activate
          maturin develop --features python

      - name: Install test dependencies
        run: |
          source .venv/bin/activate
          uv pip install .[test]

      - name: Generate test output data
        run: cargo test

      - name: Test integration and array batch regressions
        run: |
          source .venv/bin/activate
          python -m unittest python_examples.test_fast_math python_examples.test_mask_modes python_examples.test_batch_array_borrowing python_examples.test_image_switching python_examples.test_azimuthal_std python_examples.test_azimuthal_range python_examples.test_dynamic_plan python_examples.test_multi2d python_examples.test_input_validation

      - name: Compare pyFAI-compatible full splitting
        run: |
          source .venv/bin/activate
          python python_examples/test_pyfai_full.py

      - name: Test typed TIFF input and persistent file workers
        run: |
          source .venv/bin/activate
          python scripts/check_file_pipeline.py

      - name: Run Python examples
        run: |
          source .venv/bin/activate
          python test_examples.py

  benchmarks:
    name: Benchmarks (no regression check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run benchmarks
        run: |
          cargo bench --bench integrate --no-run
          cargo bench --bench build --no-run
          cargo bench --bench integrator --no-run
