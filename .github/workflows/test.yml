name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A new push to a pull request cancels the run for the previous push; runs on
# main each get their own group, so every merged commit is tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The full Rust test suite and the format check run in ci.yml.
jobs:
  # The scripts in python_examples compare against the text files these Rust
  # tests write to test_data/test_output. Generate them once and share them
  # across the Python version matrix instead of compiling and running the Rust
  # test binary five times.
  test-data:
    name: Generate Test Output Data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: test-data

      - name: Generate test output data
        env:
          CARGO_PROFILE_TEST_OPT_LEVEL: 0
        run: >-
          cargo test --lib -- --exact
          frame::tests::frame_from_tiff
          geometry::tests::calc_azimuth_all
          geometry::tests::calc_pixel_positions_det_reference
          geometry::tests::calc_pixel_positions_poni_reference
          geometry::tests::calc_pixel_positions_with_sample_reference
          geometry::tests::calc_polarization
          geometry::tests::calc_solid_angle
          geometry::tests::calc_tth_all
          integration::tests::test_integrate_counting_1d
          integration::tests::test_integrate_counting_1d_with_errors
          integration::tests::test_integrate_pixel_split_1d
          integration::tests::test_integrate_pixel_split_1d_with_errors
          integration::tests::test_integrate_supersampled_1d
          integration::tests::test_integrator

      - uses: actions/upload-artifact@v4
        with:
          name: test-output-data
          path: test_data/test_output
          retention-days: 1
          if-no-files-found: error

  python-tests:
    name: Python Tests & Examples
    needs: test-data
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/download-artifact@v4
        with:
          name: test-output-data
          path: test_data/test_output

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Caches dependencies only; the extension module itself is always
      # rebuilt. One cache per Python version, since PyO3 builds against it,
      # and suffixed with -nolto so the non-LTO dependency artifacts below
      # don't collide with any previous LTO cache.
      - uses: Swatinem/rust-cache@v2
        with:
          key: py${{ matrix.python-version }}-nolto

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      # Installs only the test dependencies, not the project: building the
      # project here would compile the extension a second time.
      - name: Install Python dependencies
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install maturin -r pyproject.toml --extra test

      # Skip LTO and single-CGU for CI test builds (release.yml keeps full LTO
      # for published wheels).
      - name: Build Python package
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: |
          source .venv/bin/activate
          maturin develop --release --features python

      - name: Test integration and array batch regressions
        run: |
          source .venv/bin/activate
          python -m unittest python_examples.test_fast_math python_examples.test_mask_modes python_examples.test_batch_array_borrowing python_examples.test_image_switching python_examples.test_azimuthal_std python_examples.test_azimuthal_range python_examples.test_dynamic_plan python_examples.test_multi2d python_examples.test_input_validation python_examples.test_batch_concurrency python_examples.test_batch_lifecycle python_examples.test_mixed_shapes

      - name: Compare pyFAI-compatible full splitting
        run: |
          source .venv/bin/activate
          python python_examples/test_pyfai_full.py

      - name: Test typed TIFF input and persistent file workers
        run: |
          source .venv/bin/activate
          python scripts/check_file_pipeline.py

      - name: Run Python examples
        run: |
          source .venv/bin/activate
          python test_examples.py

  benchmarks:
    name: Benchmarks (no regression check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run benchmarks
        run: |
          cargo bench --bench integrate --no-run
          cargo bench --bench build --no-run
          cargo bench --bench integrator --no-run
