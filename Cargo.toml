[package]
name = "dioptrin"
version = "0.11.0"
edition = "2024"
license = "MIT"
description = "Fast open-source 1D/2D diffraction integration with CSR lookup tables"
repository = "https://github.com/CPrescher/Dioptrin"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tiff = "0.8"
rayon = "1.5"
pyo3 = { version = "0.29", optional = true, features = ["extension-module"] }
numpy = { version = "0.29", optional = true }

[dev-dependencies]
criterion = "0.5.1"
reqwest = { version = "0.11", features = ["blocking"] }

[[bench]]
name = "integrate"
harness = false

[[bench]]
name = "build"
harness = false

[[bench]]
name = "integrator"
harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = "symbols"

[features]
python = ["numpy", "pyo3", "pyo3/extension-module"]

[lib]
crate-type = ["rlib", "cdylib"]
