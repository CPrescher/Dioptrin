[package]
name = "dioptrin"
version = "0.4.1"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tiff = "0.8"
rayon = "1.5"
pyo3 = { version = "0.27", optional = true, features = ["extension-module"] }
numpy = { version = "0.27", optional = true }
ed25519-dalek = { version = "2", optional = true, features = ["rand_core"] }
base64 = { version = "0.22", optional = true }
rand = { version = "0.8", optional = true }

[dev-dependencies]
criterion = "0.5.1"
reqwest = { version = "0.11", features = ["blocking"] }

[[bench]]
name = "integrate"
harness = false

[[bench]]
name = "build"
harness = false

[[bench]]
name = "integrator"
harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[features]
python = ["numpy", "pyo3", "pyo3/extension-module"]
licensed = ["ed25519-dalek", "base64", "rand"]

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "keygen"
path = "src/keygen/main.rs"
required-features = ["licensed"]
