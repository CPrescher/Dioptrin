[package]
name = "dioptrin"
version = "0.14.0"
edition = "2024"
license = "MIT"
description = "Fast open-source 1D/2D diffraction integration with CSR lookup tables"
repository = "https://github.com/CPrescher/Dioptrin"
homepage = "https://dioptrin.readthedocs.io/"
readme = "README.md"
keywords = ["diffraction", "x-ray", "crystallography", "synchrotron", "azimuthal"]
categories = ["science", "science::materials"]
# Ship only what a dependent build and docs.rs need. Examples, benches and
# integration tests read fixtures from test_data/, which is not published, so
# cargo drops those targets from the published manifest. maturin builds the
# PyPI sdist from this list too, adds pyproject.toml and README-pypi.md
# itself, and takes dioptrin.pyi from [tool.maturin] include in pyproject.toml.
include = [
    "/src/**",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/licenses/*.txt",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
flate2 = "1"
tiff = "0.8"
rayon = "1.5"
pyo3 = { version = "0.29", optional = true, features = ["extension-module"] }
numpy = { version = "0.29", optional = true }
cudarc = { version = "0.19.10", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-13040"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["NSString", "NSError", "NSArray", "NSData"] }
objc2-metal = { version = "0.3", optional = true, default-features = false, features = [
    "MTLDevice",
    "MTLCommandQueue",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLBlitCommandEncoder",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLLibrary",
    "MTLBuffer",
    "MTLResource",
    "MTLTypes",
    "MTLFunctionConstantValues",
    "MTLDataType",
    "MTLAllocation",
    "block2",
] }

[dev-dependencies]
libloading = "0.9"
sha2 = "0.10"
criterion = "0.5.1"
reqwest = { version = "0.11", features = ["blocking"] }

[[bench]]
name = "integrate"
harness = false

[[bench]]
name = "build"
harness = false

[[bench]]
name = "integrator"
harness = false

# Coverage benches for the paths the three above do not time (issue #47).
# Shared inputs live in benches/common/mod.rs; IDs are <target>/<case>/<variant>.
# See docs/benchmarks/README.md for comparing two revisions.
[[bench]]
name = "methods"
harness = false

[[bench]]
name = "detectors"
harness = false

[[bench]]
name = "plans"
harness = false

[[bench]]
name = "multi"
harness = false

[[bench]]
name = "azimuthal"
harness = false

[[bench]]
name = "batch"
harness = false

[[bench]]
name = "massif"
harness = false

# Tests spend most of their time in loops over whole detector frames, which
# run several times slower without optimisation (`cargo test` takes about a
# sixth of the time with these settings). Dependencies are compiled once and
# cached, so every dev and test build optimises them fully. The crate itself
# gets light optimisation in the test profile only: debug assertions and
# overflow checks stay on, and `cargo build` still compiles it unoptimised.
# Dev and test builds therefore no longer share the crate's own artifacts.
[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = "symbols"

[features]
python = ["numpy", "pyo3", "pyo3/extension-module"]
cuda = ["dep:cudarc"]
metal = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-metal"]

# No [lib] crate-type: Rust dependents need only the default rlib. maturin
# builds the Python extension module as a cdylib itself (it runs
# `cargo rustc --crate-type cdylib`), so declaring one here would only make
# every dependent build and link an unused dynamic library.

[package.metadata.docs.rs]
# The Python bindings need a Python interpreter at build time and are not part
# of the Rust API, so docs.rs documents the default features only. The crate
# has no platform-specific API, so one target is enough.
targets = ["x86_64-unknown-linux-gnu"]
