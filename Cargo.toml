[package]
name = "dioptrin"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tiff = "0.8"
rayon = "1.5"

[dev-dependencies]
criterion = "0.3"
reqwest = { version = "0.11", features = ["blocking"] }

[[bench]]
name = "my_benchmark"
harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[features]
# Enable lightweight LUT locality metrics and logging in integration update paths
# Example with bench 
# cargo bench --features lut_metrics
lut_metrics = []
