[package]
name = "dioptrin"
version = "0.2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tiff = "0.8"
rayon = "1.5"

[dev-dependencies]
criterion = "0.5.1"
reqwest = { version = "0.11", features = ["blocking"] }

[[bench]]
name = "integrate"
harness = false

[[bench]]
name = "build"
harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

# No optional features
